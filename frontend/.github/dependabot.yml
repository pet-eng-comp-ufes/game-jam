# Sem este arquivo o Dependabot abre um PR por pacote. Aqui ele agrupa e vem uma
# vez por semana.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
