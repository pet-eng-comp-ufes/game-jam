# PRODUCAO — este arquivo e a stack `game-jam` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda. Ou seja: **mexer aqui implanta**. Nao ha passo manual depois do merge.
#
# O que NAO esta aqui: as senhas. `${DB_PASSWORD}`, `${JWT_SECRET}` e
# `${DATABASE_URL}` sao referencias — os valores vivem nas variaveis da stack,
# dentro do Portainer, e nunca entram no git.
#
# Para rodar o back-end na sua maquina, use back-end/docker-compose.yml, que e
# outro arquivo e tem outra finalidade.
#
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    # mysql:9.5.0 — digest tirado do container que estava em execucao, nao do
    # registry: a tag 9.5.0 disponivel na VM NAO e a mesma imagem que rodava.
    # Trilha Innovation, suporte curto. A LTS e a 8.4, mas o diretorio de dados
    # da 9.5 nao abre em versao anterior: migrar exige dump e restore.
    image: mysql@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef
    container_name: game-jam_database
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - database-data:/var/lib/mysql
    networks:
      internal:
        # Alias com o projeto no nome, e NAO opcional: o back-end tambem esta
        # na rede "traefik", que e compartilhada pelas dez stacks, e la existe
        # outro servico chamado "database" (o do introcomp). Sem este alias o
        # DNS do Docker resolve "database" para o banco da OUTRA stack, e o
        # erro que aparece e "authentication failed for root" — que manda quem
        # investiga procurar senha, nao nome.
        # Hifen e nao underscore porque nome de host nao aceita underscore.
        aliases:
          - game-jam-database

  back-end:
    # ghcr.io/pet-eng-comp-ufes/game-jam/back-end:sha-d9f3e21f24779d7eedb33f7bb888531da8539a44
    # Inclui o limite de taxa no login e na inscricao (PR #46).
    image: ghcr.io/pet-eng-comp-ufes/game-jam/back-end@sha256:5a0946434520316bd0ebb0871c615333434f6bd4a65f7257d855f0da0ef6e9bb
    container_name: game-jam_back-end
    restart: unless-stopped
    logging: *logging
    stdin_open: true
    tty: true
    depends_on:
      - database
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-jam_back-end.rule=Host(`apigamejam.pet.inf.ufes.br`)"
      - "traefik.http.services.game-jam_back-end.loadbalancer.server.port=3333"
      - "traefik.http.routers.game-jam_back-end.entrypoints=websecure"
      - "traefik.http.routers.game-jam_back-end.tls.certresolver=le"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - internal
    volumes:
      - uploads:/app/tmp

  database-client:
    # phpmyadmin:5.2.3 — digest do container em execucao.
    # Nao pode sair: nao existe rota GET /participante na API, entao ele e a
    # unica forma de a organizacao ver os inscritos. Por isso fica atras de
    # basicauth, e nao removido.
    image: phpmyadmin@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    container_name: game-jam_database-client
    restart: unless-stopped
    logging: *logging
    environment:
      - PMA_HOST=game-jam-database
      - PMA_ABSOLUTE_URI=https://gamejam-db.pet.inf.ufes.br
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-jam_database-client.rule=Host(`gamejam-db.pet.inf.ufes.br`)"
      - "traefik.http.services.game-jam_database-client.loadbalancer.server.port=80"
      - "traefik.http.routers.game-jam_database-client.entrypoints=websecure"
      - "traefik.http.routers.game-jam_database-client.tls.certresolver=le"
      - "traefik.docker.network=traefik"
      # Hash bcrypt, com os $ dobrados para o compose nao tratar como variavel.
      - "traefik.http.middlewares.game-jam_database-client-auth.basicauth.users=game-jam:$$2b$$12$$H7UEfZoGNPyFTPZslcA3ruoahMQ6g2dBnAqkYUJe6hlG59pm/Y5BW"
      - "traefik.http.routers.game-jam_database-client.middlewares=game-jam_database-client-auth"
    networks:
      - traefik
      - internal

volumes:
  database-data:
  uploads:

networks:
  traefik:
    name: traefik
  internal:
    internal: true

