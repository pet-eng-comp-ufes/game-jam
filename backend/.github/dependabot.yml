# Sem este arquivo o Dependabot abre um PR por pacote, e no primeiro dia foram
# 25 alertas abertos de uma vez. Aqui ele agrupa e vem uma vez por semana.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development

  # O Dockerfile fixa a imagem base por digest. E o Dependabot que traz o digest
  # novo quando a node:22 recebe correcao — sem isso, o pino vira imagem parada.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
