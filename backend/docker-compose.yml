services:
  db:
    image: mysql
    ports:
      - ${DB_PORT}:3306
    container_name: db-gamejam
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - vol-gamejam-db:/var/lib/mysql

  api:
    build: "."
    container_name: api-gamejam
    ports:
      - ${PORT}:3333
    depends_on:
      - db
    volumes:
      - vol-imgs-tmp:/app/tmp

  phpmyadmin:
    image: phpmyadmin
    ports:
      - ${PHP_MY_ADMIN_PORT}:80
    environment:
      - PMA_ARBITRARY=1
    
volumes:
  vol-gamejam-db:
  vol-imgs-tmp:
